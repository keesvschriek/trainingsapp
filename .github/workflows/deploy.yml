name: Publiceren op GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Kobo-app voor bijwerken via wifi
        run: |
          npx tsx scripts/export-kobo.ts kobo/app/data
          npx tsx scripts/export-kobo-map.ts kobo/app/data
          KOBO_VERSION="$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)" node scripts/kobo-pages.mjs dist/kobo
          # de zip om met de kabel te installeren, altijd de nieuwste
          sudo apt-get install -y -qq zip >/dev/null
          sh kobo/build.sh dist/kobo/kees-study-kobo.zip
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
