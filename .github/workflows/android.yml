name: Android-app bouwen

on:
  push:
    branches: [main]
    # Alleen een nieuwe telefoon-app als er aan de app zelf iets verandert.
    # De Kobo-app gaat via GitHub Pages (bijwerken via wifi), quizpakketten haalt de app zelf op.
    paths-ignore:
      - 'kobo/**'
      - 'quiz-packs/**'
      - 'scripts/kobo-pages.mjs'
      - 'scripts/export-kobo*.ts'
      - 'scripts/pack-*.py'
      - 'scripts/make-fragments.mjs'
      - '.github/workflows/fragments.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    # ubuntu-24.04 heeft de Android SDK al aan boord
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK controleren
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - run: npm ci
      - run: npm test

      - name: Webdeel bouwen
        run: npm run build
        env:
          BASE_PATH: /
          APP_BUILD: ${{ github.run_number }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Android-project maken
        run: |
          npx cap add android
          cp -r android-assets/res/* android/app/src/main/res/
          # Eigen Java-code: MainActivity met de widget-koppeling, de widget zelf
          SRC=android/app/src/main/java/nl/keesvschriek/trainingsapp
          ls "$SRC"
          cp android-assets/java/*.java "$SRC"/
          # Widget aanmelden in het manifest
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          receiver = '''
                  <receiver android:name=".TrainingWidget" android:exported="false" android:label="Training">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_training_info" />
                  </receiver>
          '''
          assert '</application>' in s
          s = s.replace('</application>', receiver + '    </application>', 1)
          # Delen naar K: links en tekst uit andere apps
          share = '''
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
          '''
          i = s.index('android:name=".MainActivity"')
          j = s.index('</activity>', i)
          s = s[:j] + share + s[j:]
          open(p, 'w').write(s)
          PY
          grep -n "TrainingWidget" android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: APK bouwen
        run: |
          # Vaste sleutel, zodat elke nieuwe versie over de oude heen installeert (je gegevens blijven staan)
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  vast {
                      storeFile rootProject.file('../android-assets/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.vast }
              }
          }
          GRADLE
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../trainingsapp.apk

      - name: Handtekening controleren
        run: |
          keytool -exportcert -alias androiddebugkey -keystore android-assets/debug.keystore -storepass android -file vast.der
          python3 -c "import sys; c=open('vast.der','rb').read(); a=open('trainingsapp.apk','rb').read(); sys.exit(0 if c in a else 'APK is niet met de vaste sleutel ondertekend')"

      - name: Kobo-app testen en inpakken
        run: |
          sudo apt-get install -y -qq luajit zip >/dev/null
          luajit kobo/test/chess_test.lua
          luajit kobo/test/ai_test.lua
          luajit kobo/test/lessons_test.lua | tail -1
          luajit kobo/test/lessons_test.lua | grep -q " 0 fouten"
          sh kobo/build.sh kees-study-kobo.zip

      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Trainingsapp build ${{ github.run_number }}
          body: Download trainingsapp.apk op je telefoon en installeer hem.
          files: |
            trainingsapp.apk
            kees-study-kobo.zip
          make_latest: true
