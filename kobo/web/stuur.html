<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Naar de Kobo</title>
<style>
body{font-family:-apple-system,system-ui,"Segoe UI",sans-serif;margin:0;padding:28px 22px;color:#1a1a1a;background:#fff;max-width:520px}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
p{color:#555;line-height:1.45;margin:0 0 18px}
label{display:block;font-size:14px;color:#555;margin:18px 0 6px}
input,textarea{width:100%;box-sizing:border-box;font-size:17px;padding:12px;border:1px solid #bbb;border-radius:10px;background:#fff;color:#1a1a1a}
input{letter-spacing:2px;text-transform:uppercase}
textarea{min-height:130px;font-family:inherit}
button{margin-top:22px;width:100%;font-size:17px;padding:14px;border:0;border-radius:10px;background:#1a1a1a;color:#fff}
button:disabled{background:#999}
.msg{margin-top:16px;font-size:16px}
.err{color:#a32d2d}
.ok{color:#1a1a1a;font-weight:600}
</style>
</head>
<body>
<h1>Naar de Kobo</h1>
<p>Plak de tekst en tik op Versturen. Hij gaat versleuteld naar je Kobo; alleen de Kobo met deze code kan hem lezen.</p>
<form id="f">
<label for="c">Code op de Kobo</label>
<input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD 2345">
<div id="plain">
<label for="t">Tekst of link</label>
<textarea id="t" autocomplete="off" spellcheck="false" placeholder="https://..."></textarea>
</div>
<div id="koppel" hidden>
<label for="u">Supabase-adres</label>
<input id="u" autocomplete="off" spellcheck="false" placeholder="https://xxxx.supabase.co" style="letter-spacing:0;text-transform:none">
<label for="k">Openbare sleutel (anon key)</label>
<textarea id="k" autocomplete="off" spellcheck="false" style="min-height:80px"></textarea>
<label for="e">E-mail</label>
<input id="e" type="email" autocomplete="username" style="letter-spacing:0;text-transform:none">
<label for="p">Wachtwoord</label>
<input id="p" type="password" autocomplete="current-password" style="letter-spacing:0;text-transform:none">
<p style="margin-top:10px;font-size:14px">Adres en sleutel staan in de app bij Instellingen, Synchroniseren. Je wachtwoord gaat versleuteld naar de Kobo, die logt ermee in en bewaart het niet.</p>
</div>
<button id="b" type="submit">Versturen</button>
<div id="m" class="msg" role="status"></div>
</form>
<script>
const NTFY = "https://ntfy.sh/";
const enc = new TextEncoder();
async function sha256(s) { return new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(s))); }
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
async function topic(code) { return "ks-" + hex(await sha256("kees-topic:" + code)).slice(0, 24); }
async function encrypt(code, text) {
  const data = enc.encode(text);
  const ks = new Uint8Array(data.length);
  for (let i = 0, n = 0; n < data.length; i++) {
    const block = await sha256("kees-key:" + code + ":" + i);
    for (let j = 0; j < 32 && n < data.length; j++, n++) ks[n] = block[j];
  }
  const out = data.map((x, i) => x ^ ks[i]);
  let bin = ""; out.forEach((x) => (bin += String.fromCharCode(x)));
  const mac = hex(await sha256("kees-mac:" + code + text)).slice(0, 16);
  return "v1." + btoa(bin) + "." + mac;
}
const clean = (c) => c.toUpperCase().replace(/[^A-Z0-9]/g, "");
const c = document.getElementById("c"), t = document.getElementById("t"), m = document.getElementById("m"), b = document.getElementById("b");
const hp = new URLSearchParams(location.hash.slice(1));
const fromHash = hp.get("c");
const mode = hp.get("m");
const K = (id) => document.getElementById(id);
if (mode === "koppel") {
  K("plain").hidden = true; K("koppel").hidden = false;
  document.querySelector("h1").textContent = "Kobo koppelen";
  document.querySelector("p").textContent = "Vul de gegevens van je Kees Study-account in en tik op Versturen.";
  try { const m = JSON.parse(localStorage.getItem("ks-koppel") || "{}"); K("u").value = m.url || ""; K("k").value = m.key || ""; K("e").value = m.email || ""; } catch {}
}
if (fromHash) { const v = clean(fromHash); c.value = v.slice(0, 4) + " " + v.slice(4); history.replaceState(null, "", location.pathname); }
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const code = clean(c.value);
  let text = t.value.trim();
  m.className = "msg err";
  if (code.length !== 8) { m.textContent = "Vul de code van 8 tekens in die op de Kobo staat."; return; }
  if (mode === "koppel") {
    const url = K("u").value.trim(), key = K("k").value.replace(/\s/g, ""), email = K("e").value.trim(), pw = K("p").value;
    if (!/^https:\/\//.test(url) || !key || !email || !pw) { m.textContent = "Vul alle vier de velden in."; return; }
    try { localStorage.setItem("ks-koppel", JSON.stringify({ url, key, email })); } catch {}
    text = JSON.stringify({ t: "koppel", url, key, email, pw });
  } else if (!text) { m.textContent = "Plak eerst de tekst of link."; return; }
  b.disabled = true; m.className = "msg"; m.textContent = "Bezig met versturen...";
  try {
    const r = await fetch(NTFY + (await topic(code)), { method: "POST", body: await encrypt(code, text) });
    if (!r.ok) throw new Error("status " + r.status);
    m.className = "msg ok"; m.textContent = "Verstuurd. Binnen een paar seconden staat het op de Kobo.";
    t.value = ""; K("p").value = "";
  } catch (err) {
    m.className = "msg err"; m.textContent = "Versturen lukte niet (" + err.message + "). Controleer je internet en probeer het nog eens.";
  } finally { b.disabled = false; }
});
c.addEventListener("input", () => { m.textContent = ""; });
t.addEventListener("input", () => { m.textContent = ""; });
</script>
</body>
</html>
